# =============================================================================
# Publica la imagen de Keycloak en ECR.
#
# Vive en el orquestador porque el Dockerfile y el realm viven aqui: Keycloak
# es el unico componente cuya imagen no sale de un repositorio de servicio.
#
# El tag es <VERSION>-<sha del ultimo commit que toco keycloak/>. Se mira el
# historial del directorio y no el HEAD del repositorio a proposito: con el
# HEAD, un commit de documentacion en el orquestador cambiaria el tag de
# Keycloak sin que la imagen hubiera cambiado.
# =============================================================================
name: publish-keycloak

on:
  push:
    branches:
      - master
    paths:
      - keycloak/**
      - .github/workflows/publish-keycloak.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-keycloak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          # El tag mira el historial de keycloak/, no solo el ultimo commit.
          fetch-depth: 0

      - name: Validar el realm
        run: jq empty keycloak/realm-congenia.json

      - name: Calcular el tag
        id: tag
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < keycloak/VERSION)
          sha=$(git log -1 --format=%H -- keycloak | cut -c1-7)
          tag="${version}-${sha}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Tag: $tag"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Ver si el tag ya existe
        id: existe
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if aws ecr describe-images \
               --repository-name congenia/keycloak \
               --image-ids "imageTag=$TAG" >/dev/null 2>&1; then
            echo "valor=true" >> "$GITHUB_OUTPUT"
            echo "La imagen congenia/keycloak:$TAG ya esta publicada; no se reconstruye."
          else
            echo "valor=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.existe.outputs.valor == 'false'

      - uses: docker/build-push-action@v6
        if: steps.existe.outputs.valor == 'false'
        with:
          context: keycloak
          platforms: linux/amd64
          push: true
          tags: ${{ vars.ECR_REGISTRY }}/congenia/keycloak:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Version disponible para despliegue manual
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "Imagen publicada: $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Desplegar desde CONGENIA-INFRA → Actions → deploy-production → Run workflow." >> "$GITHUB_STEP_SUMMARY"
